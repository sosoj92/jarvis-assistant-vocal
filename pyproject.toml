[project]
name = "jarvis-vocal"
version = "0.1.0"
description = "Assistant vocal local en francais, pilote par Claude (outils domotique, PC, web, communication)."
readme = "README.md"
authors = [
    { name = "jarvis-vocal" }
]
requires-python = ">=3.13"
dependencies = [
    "alexapy>=1.30.0",
    "anthropic>=0.120.2",
    "audioop-lts>=0.2.2",
    "ddgs>=9.14.4",
    "discord-py>=2.7.1",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
    # Gemini : alternative cloud a Claude (palier gratuit sur AI Studio, vision).
    "google-genai>=2.19.0",
    "icalendar>=7.2.2",
    # Raccourcis clavier GLOBAUX : Windows uniquement. Sur macOS/Linux la lib
    # exige les droits root et tire tout PyObjC ; Jarvis s'en passe proprement.
    "keyboard>=0.13.5 ; sys_platform == 'win32'",
    "mcp>=2.0.0",
    "miniaudio>=1.71",
    "mss>=10.2.0",
    "numpy>=2.5.1",
    # CUDA : aucune roue pour macOS (Metal n'est pas CUDA). Windows/Linux seuls.
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9.24.0.43 ; sys_platform != 'darwin'",
    "nvidia-ml-py>=13.610.43 ; sys_platform != 'darwin'",
    "obsws-python>=1.8.0",
    "ollama>=0.6.2",
    # onnxruntime a arrete les roues Mac INTEL apres la 1.23.2 (macosx_13_0_x86_64) :
    # au-dela, seul Apple Silicon est servi (macosx_14_0_arm64). D'ou le plafond sur
    # les seuls Mac Intel. Corollaire pour Apple Silicon : macOS 14 minimum, sinon
    # epingler onnxruntime==1.23.2 a la main (voir TROUBLESHOOTING_MAC.md).
    # openWakeWord, faster-whisper et piper-tts fonctionnent avec la 1.23.
    "onnxruntime>=1.28.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.23.2,<1.24 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "openwakeword>=0.4.0",
    "pillow>=12.3.0",
    "piper-tts>=1.3.0",
    "playwright>=1.62.0",
    # macOS : accès Cocoa/CoreGraphics (fenêtre active, touches multimédia,
    # écrans). Tout a un repli osascript, mais PyObjC est plus rapide et plus fin.
    "pyobjc-framework-cocoa>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11.0 ; sys_platform == 'darwin'",
    "psutil>=7.2.2",
    "pyngrok>=8.1.2",
    "pyyaml>=6.0.3",
    # Capture du son système (loopback) : WASAPI/PulseAudio. Pas de backend macOS.
    "soundcard>=0.4.6 ; sys_platform != 'darwin'",
    "sounddevice>=0.5.5",
    "truststore>=0.10.4",
    "twilio>=9.10.9",
    # Borne elargie : google-genai exige <17. Aucun module du projet n'importe
    # websockets directement, et aucune autre dependance ne le tire.
    "websockets>=13.0",
]

[project.scripts]
jarvis-vocal = "jarvis_vocal:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
