<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS · Reacteur arc</title>
<style>
  :root {
    --fond: #04070a;
    --texte: #9fb6c0;
    --texte-faible: #4c626d;
    --vous: #6fe3ff;
    --jarvis: #ffb23e;
    --mono: "Consolas", "SF Mono", "Menlo", "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--fond);
    color: var(--texte);
    font-family: var(--mono);
  }

  /* Halo radial tres sombre derriere le reacteur. */
  #scene {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 46%, rgba(20,60,80,0.10), transparent 55%),
      radial-gradient(circle at 50% 120%, rgba(10,30,45,0.25), transparent 60%),
      var(--fond);
  }

  #reacteur {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(72vmin, 640px);
    height: min(72vmin, 640px);
  }

  /* --- releve d'etat, en haut a gauche --- */
  .releve {
    position: fixed;
    top: 34px; left: 40px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 2.1;
    color: var(--texte-faible);
    user-select: none;
  }
  .releve .champ { display: flex; gap: 12px; align-items: center; }
  .releve .cle { width: 74px; color: var(--texte-faible); }
  .releve .val { color: var(--texte); }
  .releve .val.actif { color: var(--vous); text-shadow: 0 0 10px rgba(111,227,255,0.5); }

  /* petite pastille systeme */
  .pastille {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #d24b4b;
    box-shadow: 0 0 8px #d24b4b;
  }
  .pastille.enligne { background: #52e0a0; box-shadow: 0 0 8px #52e0a0; }

  /* jauge de niveau */
  .jauge {
    width: 120px; height: 6px;
    border: 1px solid rgba(120,150,165,0.35);
    position: relative;
    overflow: hidden;
  }
  .jauge > i {
    position: absolute; inset: 0;
    width: 0%;
    background: linear-gradient(90deg, rgba(111,227,255,0.2), var(--vous));
    box-shadow: 0 0 12px rgba(111,227,255,0.6);
    transition: width 0.08s linear;
  }

  /* --- horloge, en haut a droite --- */
  .horloge {
    position: fixed;
    top: 30px; right: 42px;
    text-align: right;
    user-select: none;
  }
  .horloge .heure {
    font-size: 30px;
    letter-spacing: 6px;
    color: var(--texte);
    text-shadow: 0 0 14px rgba(120,180,200,0.25);
  }
  .horloge .date {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--texte-faible);
    margin-top: 6px;
  }

  /* --- etiquette d'etat sous le reacteur --- */
  .etiquette-etat {
    position: fixed;
    left: 50%;
    top: calc(50% + min(38vmin, 340px));
    transform: translate(-50%, -50%);
    font-size: 13px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--vous);
    text-shadow: 0 0 16px currentColor;
    user-select: none;
    transition: color 0.4s ease;
  }

  /* --- transcription, en bas --- */
  .transcription {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    width: min(760px, 84vw);
    max-height: 210px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 34%);
            mask-image: linear-gradient(180deg, transparent, #000 34%);
  }
  .ligne {
    font-size: 13.5px;
    letter-spacing: 0.4px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(6px);
    animation: entree 0.35s ease forwards;
  }
  @keyframes entree { to { opacity: 1; transform: none; } }

  .ligne .qui {
    font-size: 9.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--texte-faible);
    display: block;
    margin-bottom: 1px;
  }
  .ligne.vous { text-align: left; color: var(--vous); }
  .ligne.vous .qui { color: rgba(111,227,255,0.55); }
  .ligne.jarvis { text-align: right; color: var(--jarvis); }
  .ligne.jarvis .qui { color: rgba(255,178,62,0.55); }
  .ligne.outil {
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texte-faible);
  }
  .ligne.outil b { color: #8aa2ad; font-weight: 600; }

  /* --- equerres de coin facon HUD --- */
  .coin {
    position: fixed;
    width: 26px; height: 26px;
    border: 2px solid rgba(120,160,180,0.35);
    pointer-events: none;
  }
  .coin.hg { top: 20px; left: 22px; border-right: none; border-bottom: none; }
  .coin.hd { top: 20px; right: 22px; border-left: none; border-bottom: none; }
  .coin.bg { bottom: 20px; left: 22px; border-right: none; border-top: none; }
  .coin.bd { bottom: 20px; right: 22px; border-left: none; border-top: none; }
</style>
</head>
<body>
  <div id="scene"></div>
  <canvas id="reacteur"></canvas>

  <div class="etiquette-etat" id="etiquetteEtat">VEILLE</div>

  <div class="releve">
    <div class="champ"><span class="cle">Systeme</span>
      <span class="val"><span class="pastille" id="pastille"></span>
      <span id="vSysteme">Hors ligne</span></span></div>
    <div class="champ"><span class="cle">Modele</span>
      <span class="val" id="vModele">—</span></div>
    <div class="champ"><span class="cle">Ecoute</span>
      <span class="val" id="vEcoute">—</span></div>
    <div class="champ"><span class="cle">Niveau</span>
      <span class="jauge"><i id="vJauge"></i></span></div>
    <div class="champ"><span class="cle">Routage</span>
      <span class="val" id="vRoutage">—</span></div>
    <div class="champ"><span class="cle">Budget</span>
      <span class="val" id="vBudget">—</span></div>
    <div class="champ"><span class="cle">Hermes</span>
      <span class="val" id="vHermes">—</span></div>
  </div>

  <div id="bandeauConfirm" style="display:none;position:fixed;top:64px;left:50%;
    transform:translateX(-50%);padding:8px 18px;border-radius:10px;z-index:9;
    background:rgba(245,185,66,.14);border:1px solid rgba(245,185,66,.5);
    color:#f5b942;font-size:14px;letter-spacing:.05em">⏳ En attente de confirmation…</div>
  <div id="badgeMuet" style="display:none;position:fixed;top:16px;right:16px;z-index:9;
    padding:5px 12px;border-radius:999px;background:rgba(255,107,107,.16);
    border:1px solid rgba(255,107,107,.5);color:#ff8a8a;font-size:12px">🔇 Micro coupé</div>
  <div id="badgeDemo" style="display:none;position:fixed;top:16px;left:16px;z-index:9;
    padding:5px 12px;border-radius:8px;background:rgba(245,185,66,.16);
    border:1px solid rgba(245,185,66,.6);color:#f5b942;font-size:12px;letter-spacing:.1em">
    DÉMO — rien n'est réel</div>

  <div class="horloge">
    <div class="heure" id="vHeure">--:--:--</div>
    <div class="date" id="vDate">—</div>
  </div>

  <div class="transcription" id="transcription"></div>

  <div class="coin hg"></div>
  <div class="coin hd"></div>
  <div class="coin bg"></div>
  <div class="coin bd"></div>

<script>
"use strict";

// ------------------------------------------------------------- etat courant

const S = {
  etat: "veille",
  niveauCible: 0,
  niveauLisse: 0,
  // Historique du niveau : dessine la voix en couronne autour du reacteur.
  historique: new Array(128).fill(0),
  // Ondes emises a chaque pic de parole (rayon normalise 0..1).
  ondes: [],
  modele: "—",
  stt: "—",
  enligne: false,
  routage: "—",
  budget: null,
  hermes: null,
  muet: false,
};

const LIBELLES = {
  veille: "VEILLE",
  ecoute: "ECOUTE",
  reflexion: "REFLEXION",
  parole: "PAROLE",
  muet: "MICRO COUPE",
};

// Couleur dominante par etat : cyan sourd, cyan vif, bleu-violet, ambre.
const COULEURS = {
  veille:    { r: 42,  g: 112, b: 130 },
  ecoute:    { r: 46,  g: 224, b: 255 },
  reflexion: { r: 138, g: 108, b: 255 },
  parole:    { r: 255, g: 176, b: 62  },
  muet:      { r: 255, g: 107, b: 107 },
};

let couleur = Object.assign({}, COULEURS.veille);  // couleur affichee, lissee

// ------------------------------------------------------------- utilitaires

const $ = (id) => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;

function versCouleur(cible, t) {
  couleur.r = lerp(couleur.r, cible.r, t);
  couleur.g = lerp(couleur.g, cible.g, t);
  couleur.b = lerp(couleur.b, cible.b, t);
}
function rgba(a) {
  return `rgba(${couleur.r|0},${couleur.g|0},${couleur.b|0},${a})`;
}

function arrondi(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ------------------------------------------------------------- canvas

const canvas = $("reacteur");
const ctx = canvas.getContext("2d");
let L = 0, H = 0;

function redimensionner() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  L = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.round(L * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", redimensionner);

const NB_BOBINES = 10;
const NB_TICKS = 72;

let tete = 0;              // curseur d'ecriture dans S.historique
let derniereOnde = 0;      // horodatage de la derniere onde emise

function dessiner(t) {
  requestAnimationFrame(dessiner);

  const parle = (S.etat === "parole");

  // Lissage de la couleur et du niveau. En parole, on suit la voix de plus
  // pres (0.34) : les syllabes doivent se voir, pas etre lissees en bouillie.
  versCouleur(COULEURS[S.etat] || COULEURS.veille, 0.05);
  S.niveauLisse += (S.niveauCible - S.niveauLisse) * (parle ? 0.34 : 0.15);
  const niv = S.niveauLisse;

  S.historique[tete] = niv;
  tete = (tete + 1) % S.historique.length;

  ctx.clearRect(0, 0, L, H);
  const cx = L / 2, cy = H / 2;
  const R = Math.min(L, H) * 0.46;

  const respire = 0.5 + 0.5 * Math.sin(t * 0.0018);   // pulsation lente
  const rotTicks = t * 0.00018;
  const rotBobines = -t * 0.00007;
  const rotTriangle = t * 0.00011;

  ctx.lineCap = "round";

  // --- halo exterieur diffus ---
  const halo = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.15);
  halo.addColorStop(0, rgba(0.10 + niv * (parle ? 0.26 : 0.10)));
  halo.addColorStop(1, rgba(0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.15, 0, Math.PI * 2);
  ctx.fill();

  // --- anneaux concentriques ---
  const anneaux = [1.0, 0.9, 0.62, 0.4];
  anneaux.forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(i === 0 ? 0.35 : 0.22);
    ctx.lineWidth = i === 0 ? 2 : 1.2;
    ctx.stroke();
  });

  // --- reticule de graduations qui tourne ---
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotTicks);
  for (let i = 0; i < NB_TICKS; i++) {
    const a = (i / NB_TICKS) * Math.PI * 2;
    const longue = (i % 6 === 0);
    const r1 = R * 0.78;
    const r2 = r1 + (longue ? 14 : 7);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.strokeStyle = rgba(longue ? 0.7 : 0.28);
    ctx.lineWidth = longue ? 1.8 : 1;
    ctx.stroke();
  }
  ctx.restore();

  // --- couronne de dix bobines ---
  const rc = R * 0.52;
  const bw = R * 0.13, bh = R * 0.2;
  for (let i = 0; i < NB_BOBINES; i++) {
    const a = (i / NB_BOBINES) * Math.PI * 2 + rotBobines;
    const x = cx + Math.cos(a) * rc;
    const y = cy + Math.sin(a) * rc;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI / 2);
    arrondi(ctx, -bw / 2, -bh / 2, bw, bh, 4);
    ctx.fillStyle = rgba(0.08);
    ctx.fill();
    ctx.strokeStyle = rgba(0.6);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // trait lumineux au coeur de la bobine
    ctx.beginPath();
    ctx.moveTo(0, -bh * 0.28);
    ctx.lineTo(0, bh * 0.28);
    ctx.strokeStyle = rgba(0.5 + 0.4 * respire);
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.restore();
  }

  // --- triangle central ---
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotTriangle);
  const rt = R * 0.34;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
    const x = Math.cos(a) * rt, y = Math.sin(a) * rt;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = rgba(0.55);
  ctx.lineWidth = 2;
  ctx.shadowColor = rgba(0.7);
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 0;

  // --- ondes emises pendant la parole ---
  // Chaque pic de voix lache un anneau qui s'eloigne et s'efface : on VOIT la
  // phrase sortir du reacteur au lieu d'un simple changement de couleur.
  if (parle) {
    if (niv > 0.30 && t - derniereOnde > 110) {
      S.ondes.push({ r: 0.30, a: Math.min(0.55, 0.20 + niv * 0.45) });
      derniereOnde = t;
    }
  } else if (S.ondes.length) {
    S.ondes.length = 0;
  }
  for (let i = S.ondes.length - 1; i >= 0; i--) {
    const o = S.ondes[i];
    o.r += 0.011;
    o.a *= 0.965;
    if (o.r > 1.35 || o.a < 0.02) { S.ondes.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(cx, cy, R * o.r, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(o.a);
    ctx.lineWidth = 2.4 * (1 - o.r / 1.4);
    ctx.stroke();
  }

  // --- trace de voix en couronne ---
  // L'historique du niveau devient une couronne irreguliere : la signature
  // visuelle de ce qui est en train d'etre dit.
  if (parle || niv > 0.02) {
    const n = S.historique.length;
    const base = R * 0.70;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const v = S.historique[(i + tete) % n];
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      const rr = base + v * R * 0.24;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = rgba(parle ? 0.75 : 0.30);
    ctx.lineWidth = parle ? 2.2 : 1.2;
    ctx.shadowColor = rgba(parle ? 0.8 : 0);
    ctx.shadowBlur = parle ? 14 : 0;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // --- coeur lumineux en degrade radial, enfle avec le niveau ---
  // En parole, il reagit plus fort et scintille : l'etat le plus visible.
  const ampli = parle ? 0.30 : 0.17;
  const coeurR = R * (0.16 + niv * ampli + respire * 0.015);
  const rayon = coeurR * 2.4;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rayon);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.22, rgba(0.95));
  g.addColorStop(0.55, rgba(0.32));
  g.addColorStop(1, rgba(0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, rayon, 0, Math.PI * 2);
  ctx.fill();

  // point blanc central
  ctx.beginPath();
  ctx.arc(cx, cy, coeurR * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fill();
}

// ------------------------------------------------------------- interface

function fmtBudget(b) {
  if (!b) return "—";
  let s = (Number(b.cout) || 0).toFixed(2) + "$";
  if (b.plafond) s += " / " + b.plafond + "$ (" + Math.round((b.pct || 0) * 100) + "%)";
  return s;
}
function fmtHermes(h) {
  if (!h) return "—";
  const p = [];
  if (h.taches > 0) p.push(h.taches + " tache" + (h.taches > 1 ? "s" : "") + " en cours");
  if (h.tokens != null) p.push(Number(h.tokens).toLocaleString("fr-FR") + " tok/30j");
  return p.length ? p.join(" · ") : "au repos";
}

function majReleve() {
  $("vModele").textContent = S.modele || "—";
  $("vEcoute").textContent = S.stt || "—";
  $("vSysteme").textContent = S.enligne ? "En ligne" : "Hors ligne";
  $("pastille").classList.toggle("enligne", S.enligne);
  $("vRoutage").textContent = S.routage || "—";
  $("vBudget").textContent = fmtBudget(S.budget);
  $("vHermes").textContent = fmtHermes(S.hermes);
  $("badgeMuet").style.display = S.muet ? "block" : "none";
  // budget proche/au plafond : la ligne vire à l'ambre puis au rouge.
  const pct = S.budget && S.budget.plafond ? (S.budget.pct || 0) : 0;
  $("vBudget").style.color = pct >= 1 ? "#ff6b6b" : (pct >= 0.8 ? "#f5b942" : "");

  const et = LIBELLES[S.etat] || S.etat.toUpperCase();
  const eti = $("etiquetteEtat");
  eti.textContent = et;
  const c = COULEURS[S.etat] || COULEURS.veille;
  eti.style.color = `rgb(${c.r},${c.g},${c.b})`;

  // La valeur "ecoute" s'illumine quand on est en ecoute active.
  $("vEcoute").classList.toggle("actif", S.etat === "ecoute");
}

function majNiveau() {
  $("vJauge").style.width = Math.round(S.niveauLisse * 100) + "%";
  requestAnimationFrame(majNiveau);
}

// transcription : on empile les lignes, on garde les dernieres.
const fluxTexte = $("transcription");
function ajouterLigne(html, classe) {
  const div = document.createElement("div");
  div.className = "ligne " + classe;
  div.innerHTML = html;
  fluxTexte.appendChild(div);
  while (fluxTexte.children.length > 14) {
    fluxTexte.removeChild(fluxTexte.firstChild);
  }
}
function echap(s) {
  return String(s).replace(/[&<>]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// ------------------------------------------------------------- horloge

const JOURS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi",
               "Vendredi", "Samedi"];
const MOIS = ["Janvier", "Fevrier", "Mars", "Avril", "Mai", "Juin", "Juillet",
              "Aout", "Septembre", "Octobre", "Novembre", "Decembre"];
function majHorloge() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  $("vHeure").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  $("vDate").textContent =
    `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
}

// ------------------------------------------------------------- evenements

function appliquer(ev) {
  switch (ev.t) {
    case "etat":
      S.etat = ev.v;
      majReleve();
      break;
    case "niveau":
      S.niveauCible = ev.v;
      break;
    case "config":
      S.modele = ev.modele;
      S.stt = ev.stt;
      majReleve();
      break;
    case "vous":
      ajouterLigne(`<span class="qui">Vous</span>${echap(ev.texte)}`, "vous");
      break;
    case "jarvis":
      ajouterLigne(`<span class="qui">Jarvis</span>${echap(ev.texte)}`, "jarvis");
      break;
    case "outil":
      ajouterLigne(
        `⚙ <b>${echap(ev.nom)}</b>${ev.detail ? " · " + echap(ev.detail) : ""}`,
        "outil");
      break;
    case "routage":
      S.routage = ev.v;
      majReleve();
      break;
    case "budget":
      S.budget = { cout: ev.cout, plafond: ev.plafond, pct: ev.pct };
      majReleve();
      break;
    case "hermes":
      S.hermes = { taches: ev.taches, tokens: ev.tokens };
      majReleve();
      break;
    case "confirmation":
      $("bandeauConfirm").style.display = ev.v ? "block" : "none";
      break;
    case "micro":
      S.muet = ev.v;
      majReleve();
      break;
    case "demo":
      $("badgeDemo").style.display = ev.v ? "block" : "none";
      break;
  }
}

// ------------------------------------------------------------- connexion SSE

function connecter() {
  let source;
  try {
    source = new EventSource("/flux");
  } catch (e) {
    S.enligne = false; majReleve();
    return;
  }
  source.onopen = () => { S.enligne = true; majReleve(); };
  source.onmessage = (e) => {
    try { appliquer(JSON.parse(e.data)); } catch (err) {}
  };
  source.onerror = () => {
    // EventSource se reconnecte tout seul ; on marque juste hors ligne.
    S.enligne = false; majReleve();
  };
}

// ------------------------------------------------------------- demonstration

// Rejoue un scenario cote page, pour voir le rendu sans serveur quand la
// page est ouverte directement (file://).
function demonstration() {
  S.enligne = true;
  appliquer({ t: "config", modele: "qwen2.5:7b (demo)", stt: "whisper medium" });

  const tours = [
    ["allume la lumiere de la chambre", "allumer_lumiere", "chambre -> on",
     "C'est fait, la chambre est allumee."],
    ["mets le salon en bleu", "changer_couleur", "salon -> bleu",
     "Voila, le salon passe en bleu."],
    ["quelle heure est-il", "heure_et_date", "",
     "Il est vingt-deux heures dix."],
  ];

  let i = 0, minuteurNiveau = 0;
  function bruit(base, amp, vitesse) {
    clearInterval(minuteurNiveau);
    let k = 0;
    minuteurNiveau = setInterval(() => {
      k++;
      S.niveauCible = Math.max(0, base + amp * Math.abs(Math.sin(k * vitesse)));
    }, 50);
  }

  function tour() {
    const [q, outilNom, detail, rep] = tours[i % tours.length];
    i++;
    appliquer({ t: "etat", v: "veille" });
    bruit(0.05, 0.03, 0.15);
    setTimeout(() => {
      appliquer({ t: "etat", v: "ecoute" });
      appliquer({ t: "vous", texte: q });
      bruit(0.4, 0.35, 0.4);
    }, 1400);
    setTimeout(() => {
      appliquer({ t: "etat", v: "reflexion" });
      bruit(0.05, 0.02, 0.2);
      if (outilNom) appliquer({ t: "outil", nom: outilNom, detail: detail });
    }, 3600);
    setTimeout(() => {
      appliquer({ t: "etat", v: "parole" });
      appliquer({ t: "jarvis", texte: rep });
      bruit(0.3, 0.25, 0.6);
    }, 4700);
    setTimeout(() => { S.niveauCible = 0.05; tour(); }, 7200);
  }
  tour();
}

// ------------------------------------------------------------- plein ecran

// Les navigateurs refusent le plein ecran sans geste de l'utilisateur : on
// tente quand meme (une fenetre lancee en --start-fullscreen l'est deja), et
// sinon la touche F ou un clic suffit. L'indice disparait des que c'est fait.
function basculerPleinEcran() {
  const d = document;
  if (!d.fullscreenElement) {
    (d.documentElement.requestFullscreen || (() => {})).call(d.documentElement)
      ?.catch(() => {});
  } else {
    (d.exitFullscreen || (() => {})).call(d)?.catch(() => {});
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") basculerPleinEcran();
  if (e.key === "Escape" && document.fullscreenElement) document.exitFullscreen();
});

(function indicePleinEcran() {
  const indice = document.createElement("div");
  indice.textContent = "F : plein ecran";
  indice.style.cssText = "position:fixed;bottom:14px;left:50%;transform:translateX(-50%);"
    + "font:11px/1 ui-monospace,monospace;letter-spacing:.14em;color:rgba(255,255,255,.28);"
    + "pointer-events:none;transition:opacity .6s;z-index:9";
  document.body.appendChild(indice);
  const cacher = () => { indice.style.opacity = "0"; };
  document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement) cacher();
  });
  setTimeout(cacher, 8000);
})();

// Un clic n'importe ou bascule aussi : pratique sur une fenetre dediee.
document.addEventListener("dblclick", basculerPleinEcran);

// ------------------------------------------------------------- demarrage

redimensionner();
majHorloge();
majReleve();
setInterval(majHorloge, 1000);
requestAnimationFrame(dessiner);
requestAnimationFrame(majNiveau);

if (location.protocol === "file:") {
  demonstration();
} else {
  connecter();
}
